# Production deployment.
#
# Three modes, gated differently on purpose:
#
#   auth_check  authenticate, probe capabilities, compute the plan. Uses a
#               readOnly() client, so it cannot write even if the code tried.
#               Runs WITHOUT the content-validation gate — deliberately.
#   dry_run     the same plan, through the ordinary deploy path, no writes.
#   deploy      the real thing. Fail-closed behind full validation.
#
# WHY auth_check SKIPS CONTENT VALIDATION
# `site:validate` fails while PLACEHOLDER_CONTACT_EMAIL remains, which is
# correct: the site is not fit to publish. But "is the site fit to publish" and
# "does the token authenticate" are different questions, and gating the second
# on the first means the first live deployment attempt is also the first time
# anyone discovers the token is wrong. auth_check answers the second question
# only, performs zero writes, and still reports the content blocker.
#
# Code integrity is NOT skipped: auth_check runs the tests and the typecheck.
# What it skips is the content gate, which cannot affect a read-only run.
#
# Never changes site visibility. That is novra-launch.yml.
name: novra-deploy

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "auth_check (read-only) · dry_run (plan only) · deploy (writes)"
        type: choice
        options: [auth_check, dry_run, deploy]
        default: auth_check
  push:
    # The canonical production ref. `main` is NOT used: it sits at 8e60fd3 and
    # contains none of this automation, so committing deployment state there
    # would split it from the source that produced it. See
    # docs/automation-runbook.md for the promotion path if that changes.
    branches: [claude/fredrick-mendez-reputation-ijjnbq]
    paths:
      - "site/**"
      - "content/**"
      - "src/**"

permissions:
  contents: read

concurrency:
  group: novra-deploy
  cancel-in-progress: false

jobs:
  # Read-only. No content gate in front of it, because it cannot write.
  auth-check:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'auth_check' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci

      # Code integrity only. A read-only probe run from broken code is still
      # worth refusing; a read-only probe run from a site with an unresolved
      # contact address is not.
      - run: npm test
      - run: npm run typecheck

      - name: Authenticate, probe and plan
        env:
          NOVRA_WP_SITE: ${{ secrets.NOVRA_WP_SITE }}
          NOVRA_WP_ACCESS_TOKEN: ${{ secrets.NOVRA_WP_ACCESS_TOKEN }}
        run: npm run site:deploy:auth-check

  # Full validation. Separate job, no access to the production environment, so a
  # failing gate cannot be skipped on the way to a write.
  validate:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.mode != 'auth_check' }}
    uses: ./.github/workflows/novra-ci.yml

  deploy:
    needs: validate
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.mode != 'auth_check' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run site:assets
      - run: npm run site:build

      - name: Deploy
        env:
          NOVRA_WP_SITE: ${{ secrets.NOVRA_WP_SITE }}
          NOVRA_WP_ACCESS_TOKEN: ${{ secrets.NOVRA_WP_ACCESS_TOKEN }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.mode }}" = "deploy" ]; then
            npm run site:deploy
          else
            npm run site:deploy:dry-run
          fi

      - name: Upload deployment report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deployment-report
          path: site/deploy-report.json
          if-no-files-found: ignore
          retention-days: 90

      # Only the manifest is committed, and only back to the ref this run
      # deployed from. `github.ref_name` rather than a hardcoded branch: the
      # deployment state belongs on the same commit history as the source that
      # produced it, and a hardcoded target is how those two drift apart.
      #
      # Pushes made with GITHUB_TOKEN do not trigger further workflow runs,
      # which is what stops this from retriggering itself on the file it wrote.
      - name: Commit the media manifest if the sync changed it
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'deploy' }}
        run: |
          if git diff --quiet -- site/wp-media.json; then
            echo "media manifest unchanged"
            exit 0
          fi
          git config user.name "novra-deploy"
          git config user.email "noreply@users.noreply.github.com"
          git add site/wp-media.json
          git commit -m "Record Media Library URLs returned by WordPress"
          git pull --rebase origin "${{ github.ref_name }}"
          git push origin "HEAD:${{ github.ref_name }}"
