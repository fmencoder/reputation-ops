<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img">
  <title>Five classes of context passing through a single enforcement point into the model.</title>
  <defs>
    <pattern id="grid" width="52" height="52" patternUnits="userSpaceOnUse">
      <path d="M52 0H0V52" fill="none" stroke="#4d84ff" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
    <radialGradient id="focal" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2f6bff" stop-opacity="0.34"/>
      <stop offset="55%" stop-color="#7b4dff" stop-opacity="0.09"/>
      <stop offset="100%" stop-color="#05070f" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-180%" y="-180%" width="460%" height="460%">
      <feGaussianBlur stdDeviation="8.5"/>
    </filter>
  </defs>

  <rect width="1600" height="900" fill="#05070f"/>
  <rect width="1600" height="900" fill="url(#grid)"/>
  <!-- Five classes of context, two of them dashed to mark untrusted origin. -->
  <rect x="150" y="150" width="430" height="78" rx="12" fill="#0a0e1c" stroke="#4d84ff" stroke-opacity="0.42" stroke-width="1.5"/>
  <text x="182" y="198" fill="#dce6ff" fill-opacity="0.86" font-family="Inter, Helvetica, Arial, sans-serif" font-size="19" letter-spacing="3.4" font-weight="600">INSTRUCTION</text>
  <path d="M580 189 C 700 189, 760 460, 846 460" fill="none" stroke="#4d84ff" stroke-opacity="0.30" stroke-width="1.4"/>
  <rect x="150" y="276" width="430" height="78" rx="12" fill="#0a0e1c" stroke="#a07cff" stroke-opacity="0.55" stroke-width="1.5" stroke-dasharray="9 7"/>
  <text x="182" y="324" fill="#dce6ff" fill-opacity="0.86" font-family="Inter, Helvetica, Arial, sans-serif" font-size="19" letter-spacing="3.4" font-weight="600">RETRIEVED</text>
  <path d="M580 315 C 700 315, 760 460, 846 460" fill="none" stroke="#a07cff" stroke-opacity="0.30" stroke-width="1.4" stroke-dasharray="9 7"/>
  <rect x="150" y="402" width="430" height="78" rx="12" fill="#0a0e1c" stroke="#a07cff" stroke-opacity="0.55" stroke-width="1.5" stroke-dasharray="9 7"/>
  <text x="182" y="450" fill="#dce6ff" fill-opacity="0.86" font-family="Inter, Helvetica, Arial, sans-serif" font-size="19" letter-spacing="3.4" font-weight="600">TOOL</text>
  <path d="M580 441 C 700 441, 760 460, 846 460" fill="none" stroke="#a07cff" stroke-opacity="0.30" stroke-width="1.4" stroke-dasharray="9 7"/>
  <rect x="150" y="528" width="430" height="78" rx="12" fill="#0a0e1c" stroke="#4d84ff" stroke-opacity="0.42" stroke-width="1.5"/>
  <text x="182" y="576" fill="#dce6ff" fill-opacity="0.86" font-family="Inter, Helvetica, Arial, sans-serif" font-size="19" letter-spacing="3.4" font-weight="600">MEMORY</text>
  <path d="M580 567 C 700 567, 760 460, 846 460" fill="none" stroke="#4d84ff" stroke-opacity="0.30" stroke-width="1.4"/>
  <rect x="150" y="654" width="430" height="78" rx="12" fill="#0a0e1c" stroke="#4d84ff" stroke-opacity="0.42" stroke-width="1.5"/>
  <text x="182" y="702" fill="#dce6ff" fill-opacity="0.86" font-family="Inter, Helvetica, Arial, sans-serif" font-size="19" letter-spacing="3.4" font-weight="600">POLICY</text>
  <path d="M580 693 C 700 693, 760 460, 846 460" fill="none" stroke="#4d84ff" stroke-opacity="0.30" stroke-width="1.4"/>
  <!-- The gate: the enforcement point that sits outside the window. -->
  <rect x="846" y="250" width="16" height="420" rx="8" fill="#4d84ff" fill-opacity="0.30" filter="url(#soft)"/>
  <rect x="850" y="258" width="9" height="404" rx="4.5" fill="#dce6ff" fill-opacity="0.92"/>
  <text x="854" y="722" fill="#4d84ff" fill-opacity="0.92" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="17" letter-spacing="2.6" font-weight="600">ENFORCEMENT</text>
  <ellipse cx="1210" cy="460" rx="440" ry="330" fill="url(#focal)"/>
  <circle cx="1210" cy="460" r="15" fill="#7b4dff" fill-opacity="0.95"/>
  <circle cx="1210" cy="460" r="34" fill="none" stroke="#a07cff" stroke-opacity="0.42" stroke-width="1.3"/>
  <circle cx="1210" cy="460" r="74" fill="none" stroke="#4d84ff" stroke-opacity="0.24" stroke-width="1.2"/>
  <circle cx="1064" cy="378" r="5" fill="#dce6ff" fill-opacity="0.80"/>
  <circle cx="1338" cy="536" r="6" fill="#dce6ff" fill-opacity="0.72"/>
  <circle cx="1286" cy="336" r="4.5" fill="#a07cff" fill-opacity="0.80"/>
</svg>
