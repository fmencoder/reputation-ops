  <path d="M906 320 L 956 320" stroke="#a07cff" stroke-opacity="0.55" stroke-width="1.8" stroke-dasharray="7 8"/>
  <path d="M978 320 L 1028 320" stroke="#4d84ff" stroke-opacity="0.30" stroke-width="1.8" stroke-dasharray="7 8"/>
  <line x1="951" y1="298" x2="983" y2="342" stroke="#a07cff" stroke-opacity="0.85" stroke-width="2.4"/>
  <line x1="983" y1="298" x2="951" y2="342" stroke="#a07cff" stroke-opacity="0.85" stroke-width="2.4"/>
  <line x1="1072 " y1="320" x2="1194" y2="320" stroke="#4d84ff" stroke-opacity="0.28" stroke-width="1.6"/>
  <line x1="1238 " y1="320" x2="1360" y2="320" stroke="#4d84ff" stroke-opacity="0.28" stroke-width="1.6"/>
