<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img">
  <title>An execution chain broken mid-way, resuming from an append-only history rather than from the start.</title>
  <defs>
    <pattern id="grid" width="52" height="52" patternUnits="userSpaceOnUse">
      <path d="M52 0H0V52" fill="none" stroke="#4d84ff" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
    <radialGradient id="focal" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2f6bff" stop-opacity="0.34"/>
      <stop offset="55%" stop-color="#7b4dff" stop-opacity="0.09"/>
      <stop offset="100%" stop-color="#05070f" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-180%" y="-180%" width="460%" height="460%">
      <feGaussianBlur stdDeviation="8.5"/>
    </filter>
  </defs>

  <rect width="1600" height="900" fill="#05070f"/>
  <rect width="1600" height="900" fill="url(#grid)"/>
  <!-- Execution chain above, append-only history below. Recovery reads from the history. -->
  <line x1="242 " y1="320" x2="364" y2="320" stroke="#4d84ff" stroke-opacity="0.28" stroke-width="1.6"/>
  <line x1="408 " y1="320" x2="530" y2="320" stroke="#4d84ff" stroke-opacity="0.28" stroke-width="1.6"/>
