<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img">
  <title>Two timelines comparing detection, decision and action against the point of irreversibility.</title>
  <defs>
    <pattern id="grid" width="52" height="52" patternUnits="userSpaceOnUse">
      <path d="M52 0H0V52" fill="none" stroke="#4d84ff" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
    <radialGradient id="focal" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2f6bff" stop-opacity="0.34"/>
      <stop offset="55%" stop-color="#7b4dff" stop-opacity="0.09"/>
      <stop offset="100%" stop-color="#05070f" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-180%" y="-180%" width="460%" height="460%">
      <feGaussianBlur stdDeviation="8.5"/>
    </filter>
  </defs>

  <rect width="1600" height="900" fill="#05070f"/>
  <rect width="1600" height="900" fill="url(#grid)"/>
  <!-- Oversight is real only while detect + decide + act still fit before irreversibility. -->
  <line x1="180" y1="300" x2="1440" y2="300" stroke="#1b2340" stroke-width="2"/>
  <rect x="180" y="281" width="380" height="38" rx="7" fill="#0a0e1c" stroke="#4d84ff" stroke-opacity="0.62" stroke-width="1.5"/>
  <text x="370" y="306" fill="#dce6ff" fill-opacity="0.84" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="15" letter-spacing="2.2" font-weight="600">DETECT</text>
  <rect x="560" y="281" width="340" height="38" rx="7" fill="#0a0e1c" stroke="#4d84ff" stroke-opacity="0.62" stroke-width="1.5"/>
  <text x="730" y="306" fill="#dce6ff" fill-opacity="0.84" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="15" letter-spacing="2.2" font-weight="600">DECIDE</text>
  <rect x="900" y="281" width="250" height="38" rx="7" fill="#0a0e1c" stroke="#4d84ff" stroke-opacity="0.62" stroke-width="1.5"/>
  <text x="1025" y="306" fill="#dce6ff" fill-opacity="0.84" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="15" letter-spacing="2.2" font-weight="600">ACT</text>
  <circle cx="180" cy="300" r="8" fill="#dce6ff" fill-opacity="0.92"/>
  <line x1="1330" y1="208" x2="1330" y2="372" stroke="#4d84ff" stroke-opacity="0.85" stroke-width="2.4"/>
  <circle cx="1330" cy="300" r="11" fill="#4d84ff" fill-opacity="0.30" filter="url(#soft)"/>
  <path d="M1160 300 L 1320 300" stroke="#4d84ff" stroke-opacity="0.75" stroke-width="2.6"/>
  <text x="1240" y="262" fill="#4d84ff" fill-opacity="0.95" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="15" letter-spacing="2.2" font-weight="600">MARGIN</text>
  <text x="180" y="182" fill="#dce6ff" fill-opacity="0.80" font-family="Inter, Helvetica, Arial, sans-serif" font-size="19" letter-spacing="3.4" font-weight="600">OVERSIGHT HOLDS</text>
  <line x1="180" y1="660" x2="1440" y2="660" stroke="#1b2340" stroke-width="2"/>
  <rect x="180" y="641" width="380" height="38" rx="7" fill="#0a0e1c" stroke="#4d84ff" stroke-opacity="0.62" stroke-width="1.5"/>
  <text x="370" y="666" fill="#dce6ff" fill-opacity="0.84" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="15" letter-spacing="2.2" font-weight="600">DETECT</text>
  <rect x="560" y="641" width="340" height="38" rx="7" fill="#0a0e1c" stroke="#a07cff" stroke-opacity="0.62" stroke-width="1.5" stroke-dasharray="9 7"/>
  <text x="730" y="666" fill="#dce6ff" fill-opacity="0.84" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="15" letter-spacing="2.2" font-weight="600">DECIDE</text>
  <rect x="900" y="641" width="250" height="38" rx="7" fill="#0a0e1c" stroke="#a07cff" stroke-opacity="0.62" stroke-width="1.5" stroke-dasharray="9 7"/>
  <text x="1025" y="666" fill="#dce6ff" fill-opacity="0.84" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="15" letter-spacing="2.2" font-weight="600">ACT</text>
  <circle cx="180" cy="660" r="8" fill="#dce6ff" fill-opacity="0.92"/>
  <line x1="700" y1="568" x2="700" y2="732" stroke="#a07cff" stroke-opacity="0.85" stroke-width="2.4"/>
  <circle cx="700" cy="660" r="11" fill="#a07cff" fill-opacity="0.30" filter="url(#soft)"/>
  <text x="180" y="542" fill="#a07cff" fill-opacity="0.86" font-family="Inter, Helvetica, Arial, sans-serif" font-size="19" letter-spacing="3.4" font-weight="600">SAME PROCESS, FASTER SYSTEM</text>
  <text x="1330" y="216" fill="#4d84ff" fill-opacity="0.90" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="17" letter-spacing="2.6" font-weight="600">IRREVERSIBLE</text>
  <text x="700" y="576" fill="#a07cff" fill-opacity="0.92" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="17" letter-spacing="2.6" font-weight="600">IRREVERSIBLE</text>
  <text x="1155" y="768" fill="#a07cff" fill-opacity="0.78" font-family="Inter, Helvetica, Arial, sans-serif" font-size="15" letter-spacing="2.2" font-weight="600">REVIEW ARRIVES AFTER THE FACT</text>
</svg>
