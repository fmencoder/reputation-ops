<!--
  ABOUT PORTRAIT — READY TO INSERT, NOT YET LIVE.

  This markup is parked here rather than in site/pages/about.html because the
  approved portrait asset has not been supplied as a file. It arrived only as
  pixels inside a mockup image in conversation, which cannot be extracted, and
  the instruction was explicit: do not regenerate the face, do not substitute
  another portrait. So the About page ships today without an image rather than
  with the wrong one.

  TO GO LIVE:
    1. Put the approved portrait at site/assets/author-portrait.webp
       (portrait crop, roughly 3:4, 900px wide is plenty).
       Add it to TARGETS in site/render-assets.mjs if you want it rasterised
       from an SVG or larger original; a WebP dropped straight in also works.
    2. Upload it with the media.create flow and record the returned source_url
       in site/wp-media.json under /assets/author-portrait.webp.
    3. Paste the block below into site/pages/about.html, immediately after the
       closing tag of the first child div inside div.wrap.hero-split, and change
       that wrapper's class from "wrap" back to "wrap hero-split".
    4. Rebuild and re-run the QA. The alt text must describe the person, not the
       composition.
-->
<figure class="portrait" style="margin:0">
  <img src="/assets/author-portrait.webp" width="900" height="1200" alt="Fredrick Mendez" style="display:block;width:100%;height:auto">
</figure>
